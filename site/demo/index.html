<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rooftop — dealer demo · Cascade Motors</title>
<meta name="description" content="Rooftop Auto — inventory, merchandising, syndication, website and reporting for independent used car lots.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,900&display=swap" rel="stylesheet">
<style>/* ===== Rooftop design tokens =====
   Charcoal + indigo. Deliberately outside the aging color ramp
   (green -> cyan -> amber -> orange -> red) so brand never
   competes with the thing dealers are supposed to read first. */
:root{
  --ink:#0f1620; --ink2:#39434f; --ink3:#6d7886; --ink4:#9aa4b1;
  --line:#e3e7ec; --line2:#eef1f4;
  --bg:#f1f3f6; --card:#fff; --card2:#f8fAfc;
  --brand:#2C6FD8; --brand2:#3D8BFF; --brand-dk:#1F55A8; --brand-wash:#E9F2FF;

  --b0:#15a34a; --b0w:#e6f6ec;   /* 0-15  fresh air   */
  --b1:#0e8fa8; --b1w:#e3f4f8;   /* 16-30             */
  --b2:#c9760a; --b2w:#fdf1e0;   /* 31-45  at-risk    */
  --b3:#e2560d; --b3w:#fdece2;   /* 46-60  at-risk    */
  --b4:#cf2b26; --b4w:#fce8e7;   /* 61+    aged unit  */

  --ok:#15a34a; --warn:#c9760a; --err:#cf2b26;
  --r:10px; --r2:14px;
  --sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --sh2:0 4px 16px rgba(16,24,40,.09),0 1px 3px rgba(16,24,40,.06);
  --ff:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --fh:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --fm:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff);background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm)}

/* ===== chrome ===== */
.topbar{position:sticky;top:0;z-index:60;height:58px;background:var(--ink);
  display:flex;align-items:center;gap:8px;padding:0 18px;color:#fff}
.brand{display:flex;align-items:center;font-family:var(--fh);font-style:italic;font-weight:900;letter-spacing:-.5px;font-size:18px;line-height:1;white-space:nowrap;margin-right:16px}
.brand i{position:relative;display:inline-block;width:.363em;height:0;vertical-align:baseline;font-style:normal}
.brand i svg{position:absolute;left:0;bottom:-.218em;width:.476em;height:1.089em;fill:#3D8BFF;overflow:visible}
.brandmark{width:26px;height:26px;border-radius:7px;background:linear-gradient(140deg,var(--brand2),var(--brand-dk));
  display:grid;place-items:center;flex:0 0 auto}
.brandmark svg{width:15px;height:15px}
.brand small{font-weight:600;font-size:10px;letter-spacing:1.6px;color:#8e97a6;
  border-left:1px solid #303a47;padding-left:9px;margin-left:2px}
.nav{display:flex;gap:2px}
.nav a{padding:8px 13px;border-radius:8px;font-weight:600;font-size:13.5px;color:#b6bec9}
.nav a:hover{background:#1d2632;color:#fff}
.nav a.on{background:#273140;color:#fff}
.spacer{flex:1}
.rtpick{display:flex;align-items:center;gap:7px;background:#1c2531;border:1px solid #2c3745;
  border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;color:#d6dbe2}
.rtpick select{background:none;border:0;color:#fff;font-weight:700;font-size:12.5px;outline:none}
.rtpick select option{color:#000}
.iconbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#b6bec9;position:relative}
.iconbtn:hover{background:#1d2632;color:#fff}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#f0563c;border:2px solid var(--ink)}
.me{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff}

.wrap{max-width:1400px;margin:0 auto;padding:18px 22px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:18px;align-items:start}
.cols.one{grid-template-columns:minmax(0,1fr)}
@media(max-width:1180px){.cols{grid-template-columns:minmax(0,1fr) 316px}.railL{display:none}}
@media(max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}.railR{display:none}}
.sticky{position:sticky;top:76px}

/* ===== primitives ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh)}
.pad{padding:16px}
.hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line2)}
.hd h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--ink2)}
.muted{color:var(--ink3)}
.tiny{font-size:11.5px}
.sm{font-size:12.5px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;font-weight:700;font-size:13px;
  background:var(--brand);color:#fff;box-shadow:var(--sh);white-space:nowrap}
.btn:hover{background:var(--brand-dk)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--card2);color:var(--ink)}
.btn.dark{background:var(--ink)}.btn.dark:hover{background:#1e2734}
.btn.sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11.5px;font-weight:800;letter-spacing:.2px;background:var(--line2);color:var(--ink2);white-space:nowrap}
.chip.b0{background:var(--b0w);color:var(--b0)}.chip.b1{background:var(--b1w);color:var(--b1)}
.chip.b2{background:var(--b2w);color:var(--b2)}.chip.b3{background:var(--b3w);color:var(--b3)}
.chip.b4{background:var(--b4w);color:var(--b4)}
.chip.brand{background:var(--brand-wash);color:var(--brand-dk)}
.chip.ok{background:var(--b0w);color:var(--b0)}
.chip.err{background:var(--b4w);color:var(--b4)}
.chip.warn{background:var(--b2w);color:var(--b2)}
.pill{display:inline-block;width:8px;height:8px;border-radius:50%}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
hr.sep{border:0;border-top:1px solid var(--line2);margin:0}

/* ===== metrics strip ===== */
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh)}
@media(max-width:820px){.metrics{grid-template-columns:repeat(3,1fr)}}
.metric{padding:13px 15px;border-right:1px solid var(--line2)}
.metric:last-child{border-right:0}
.metric .k{font-size:10.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink3)}
.metric .v{font-size:25px;font-weight:800;letter-spacing:-1px;margin-top:3px;line-height:1.1}
.metric .n{font-size:11.5px;font-weight:600;color:var(--ink3);margin-top:1px}
.metric .n b{font-weight:800}
.up{color:var(--ok)}.down{color:var(--err)}

/* ===== left rail ===== */
.railL .lnk{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:9px;font-weight:650;font-size:13.5px;color:var(--ink2)}
.railL .lnk:hover{background:#e7eaef}
.railL .lnk.on{background:var(--brand-wash);color:var(--brand-dk);font-weight:800}
.railL .lnk .ic{width:26px;height:26px;border-radius:7px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.railL .lnk.on .ic{background:var(--brand);border-color:var(--brand);color:#fff}
.railL .grp{font-size:10.5px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink4);padding:14px 11px 6px}

/* ===== feed ===== */
.composer{display:flex;gap:11px;align-items:center;padding:13px 15px}
.composer input{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:10px 16px;
  font-size:13.5px;outline:none}
.composer input:focus{border-color:var(--brand);background:#fff}
.quick{display:flex;gap:6px;padding:0 15px 13px;flex-wrap:wrap}
.quick button{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:8px;
  background:var(--card2);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--ink2)}
.quick button:hover{background:#eef1f5}

.post{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh);overflow:hidden}
.post .top{display:flex;gap:11px;padding:14px 16px 10px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12.5px;color:#fff;flex:0 0 auto}
.av.sys{border-radius:10px;background:linear-gradient(140deg,var(--brand2),var(--brand-dk))}
.av.sys svg{width:19px;height:19px}
.post .who{font-weight:800;font-size:14px}
.post .when{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:5px;margin-top:1px}
.post .body{padding:0 16px 12px}
.post h4{margin:0 0 4px;font-size:16.5px;font-weight:800;letter-spacing:-.35px;line-height:1.28}
.post p{margin:0;color:var(--ink2);font-size:13.5px}
.postmedia{display:block;width:100%;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.postmedia img{display:block;width:100%;aspect-ratio:760/428;object-fit:cover}
.stats{display:flex;gap:0;border-top:1px solid var(--line2)}
.stat{flex:1;padding:10px 14px;border-right:1px solid var(--line2)}
.stat:last-child{border-right:0}
.stat .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.stat .v{font-size:16px;font-weight:800;letter-spacing:-.4px;margin-top:1px}
.react{display:flex;align-items:center;gap:4px;padding:7px 10px;border-top:1px solid var(--line2)}
.rbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--ink3)}
.rbtn:hover{background:var(--card2)}
.rbtn.on{color:var(--brand-dk);background:var(--brand-wash)}
.cmts{border-top:1px solid var(--line2);background:var(--card2);padding:11px 15px;display:flex;flex-direction:column;gap:10px}
.cmt{display:flex;gap:9px}
.cmt .av{width:28px;height:28px;font-size:10.5px}
.bub{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:13px}
.bub b{display:block;font-size:12px;margin-bottom:1px}
.cmtin{display:flex;gap:9px;align-items:center}
.cmtin input{flex:1;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:12.5px;outline:none}
.cmtin input:focus{border-color:var(--brand)}

/* ===== right rail ===== */
.rrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--card2)}
.thumb{width:52px;height:34px;border-radius:6px;object-fit:cover;flex:0 0 auto;background:var(--line2)}
.board{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line2)}
.board div{background:#fff;padding:12px 14px}
.board .k{font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--ink3)}
.board .v{font-size:21px;font-weight:800;letter-spacing:-.7px;margin-top:2px}

/* ===== tables ===== */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card2);white-space:nowrap;position:sticky;top:0;z-index:5}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:hover td{background:#fafbfd;cursor:pointer}
.tbl .r{text-align:right}
.tbl .agebar{width:4px;height:30px;border-radius:2px;display:inline-block;vertical-align:middle}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line2)}
.fchip{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.fchip:hover{border-color:var(--ink4)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.fchip.on.b0{background:var(--b0);border-color:var(--b0)}.fchip.on.b1{background:var(--b1);border-color:var(--b1)}
.fchip.on.b2{background:var(--b2);border-color:var(--b2)}.fchip.on.b3{background:var(--b3);border-color:var(--b3)}
.fchip.on.b4{background:var(--b4);border-color:var(--b4)}
.search{flex:1;min-width:180px;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;outline:none;font-size:13px}
.search:focus{border-color:var(--brand);background:#fff}
select.sel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:650;outline:none}

/* ===== vehicle profile ===== */
.vhero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px}
@media(max-width:980px){.vhero{grid-template-columns:minmax(0,1fr)}}
.gal img.main{width:100%;aspect-ratio:760/428;object-fit:cover;display:block;border-radius:12px 12px 0 0}
.gstrip{display:flex;gap:6px;padding:9px;overflow-x:auto}
.gstrip img{width:74px;height:48px;object-fit:cover;border-radius:6px;flex:0 0 auto;border:2px solid transparent;cursor:pointer}
.gstrip img.on{border-color:var(--brand)}
.gstrip .add{width:74px;height:48px;border-radius:6px;border:1.5px dashed var(--line);display:grid;place-items:center;
  color:var(--ink4);font-size:18px;flex:0 0 auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line2);font-size:13px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink3);font-weight:600}
.kv .v{font-weight:750;text-align:right}
.money{background:linear-gradient(180deg,#fff,var(--card2))}
.money .kv .v{font-family:var(--fm);font-size:13px}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs button{padding:11px 14px;font-size:13px;font-weight:750;color:var(--ink3);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand-dk);border-bottom-color:var(--brand)}
.tabs button:hover{color:var(--ink)}

/* wall */
.wall{position:relative;padding:4px 0}
.wall:before{content:"";position:absolute;left:33px;top:14px;bottom:14px;width:2px;background:var(--line)}
.wev{display:flex;gap:14px;padding:10px 16px;position:relative}
.wdot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex:0 0 auto;
  background:#fff;border:2px solid var(--line);z-index:1}
.wev .t{font-size:11.5px;color:var(--ink3);font-weight:650}
.wev .h{font-weight:750;font-size:13.5px}

/* forms */
.fld{padding:12px 16px;border-bottom:1px solid var(--line2)}
.fld label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3);margin-bottom:5px}
.fld input,.fld textarea,.fld select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;font-size:13.5px;outline:none;resize:vertical}
.fld input:focus,.fld textarea:focus{border-color:var(--brand);background:#fff}
.fld .hint{font-size:11.5px;color:var(--ink3);margin-top:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.grid2>.fld{border-right:1px solid var(--line2)}
.grid2>.fld:nth-child(2n){border-right:0}

/* ===== syndication ===== */
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.ch{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--sh)}
.ch .n{display:flex;align-items:center;gap:9px;font-weight:800;font-size:13.5px}
.chlogo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:900;font-size:12px;color:#fff;flex:0 0 auto}
.ch .meta{font-size:11.5px;color:var(--ink3);margin-top:9px;line-height:1.6}
.ch .bar{height:4px;border-radius:2px;background:var(--line2);margin-top:10px;overflow:hidden}
.ch .bar i{display:block;height:100%;background:var(--ok);transition:width .5s ease}

.matrix{width:100%;border-collapse:collapse;font-size:12.5px}
.matrix th{position:sticky;top:0;background:var(--card2);z-index:5;padding:8px 6px;border-bottom:1px solid var(--line);
  font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
.matrix th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:96px;white-space:nowrap;padding:8px 2px}
.matrix td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:center}
.matrix td.l{text-align:left}
.matrix tr:hover td{background:#fafbfd}
.sdot{width:15px;height:15px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;color:#fff;font-weight:900}
.s-live{background:var(--ok)} .s-queued{background:var(--ink4)} .s-syncing{background:var(--brand)}
.s-error{background:var(--err)} .s-off{background:#dfe3e9}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.s-syncing,.s-queued{animation:pulse 1s ease-in-out infinite}

.demobar{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;padding:14px 16px;background:linear-gradient(100deg,var(--brand-wash),#fff);
  border-bottom:1px solid var(--line)}
.demobar .fld{padding:0;border:0;flex:0 0 auto}
.demobar input{width:132px;background:#fff}
.log{background:#0f1620;color:#c8d0da;font-family:var(--fm);font-size:11.5px;padding:12px 14px;
  border-radius:10px;height:200px;overflow:auto;line-height:1.75}
.log .ok{color:#5fd894}.log .er{color:#ff7f70}.log .dim{color:#6d7886}.log .br{color:#a99cff}

/* ===== storefront ===== */
.store{background:#fff}
.sthead{background:#0f1620;color:#fff;padding:0}
.sthead .in{max-width:1280px;margin:0 auto;padding:15px 20px;display:flex;align-items:center;gap:16px}
.stlogo{font-size:19px;font-weight:900;letter-spacing:-.6px}
.stnav{display:flex;gap:18px;font-size:13.5px;font-weight:650;color:#b6bec9}
.stbar{background:#1b2432;color:#cfd6de;font-size:12px}
.stbar .in{max-width:1280px;margin:0 auto;padding:7px 20px;display:flex;gap:18px;align-items:center}
.stwrap{max-width:1280px;margin:0 auto;padding:20px}
.stgrid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:900px){.stgrid{grid-template-columns:minmax(0,1fr)}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.vcard{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);transition:.15s;cursor:pointer}
.vcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.vcard img{width:100%;aspect-ratio:760/428;object-fit:cover;display:block}
.vcard .b{padding:12px 13px}
.vcard .ttl{font-weight:800;font-size:14px;letter-spacing:-.25px;line-height:1.3}
.vcard .sub{font-size:12px;color:var(--ink3);margin-top:2px}
.vcard .pr{font-size:20px;font-weight:900;letter-spacing:-.7px;margin-top:8px}
.badge{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:900;
  letter-spacing:.7px;text-transform:uppercase;color:#fff;background:rgba(15,22,32,.82);backdrop-filter:blur(4px)}
.rel{position:relative}
.frange{display:flex;gap:8px;align-items:center}
.frange input{width:100%}
.fgroup{border-bottom:1px solid var(--line2);padding:13px 0}
.fgroup:last-child{border-bottom:0}
.fgroup h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}
.cbx{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px;cursor:pointer}
.cbx input{accent-color:var(--brand)}

/* VDP */
.vdp{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
@media(max-width:900px){.vdp{grid-template-columns:minmax(0,1fr)}}
.vdpgal img.main{width:100%;aspect-ratio:760/428;object-fit:cover;border-radius:14px;display:block}
.vdpstrip{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:8px}
.vdpstrip img{width:100%;aspect-ratio:760/428;object-fit:cover;border-radius:7px;cursor:pointer;border:2px solid transparent}
.vdpstrip img.on{border-color:var(--ink)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:620px){.specs{grid-template-columns:repeat(2,1fr)}}
.specs div{background:#fff;padding:13px 14px}
.specs .k{font-size:10px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--ink3)}
.specs .v{font-weight:750;margin-top:3px;font-size:13.5px}
.feats{display:flex;flex-wrap:wrap;gap:7px}
.feat{padding:6px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:650}
.pbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh2);background:#fff}
.pbox .top{padding:16px;border-bottom:1px solid var(--line2)}
.pbox .price{font-size:34px;font-weight:900;letter-spacing:-1.6px;line-height:1}
.pay{display:flex;align-items:baseline;gap:6px;margin-top:9px;font-size:13px;color:var(--ink2)}
.pay b{font-size:19px;font-weight:900;letter-spacing:-.6px;color:var(--ink)}

/* charts */
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:0 4px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;height:100%}
.bars .bar{width:100%;border-radius:7px 7px 0 0;min-height:4px;transition:height .4s ease}
.bars .lb{font-size:11px;font-weight:750;color:var(--ink3);text-align:center}
.bars .vl{font-size:15px;font-weight:800}
.dnut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.leg{display:flex;flex-direction:column;gap:7px;font-size:12.5px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.spark{width:100%;height:78px;display:block}

/* ===== demo ribbon (only present in the hosted demo build) ===== */
.ribbon{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#1F55A8;color:#fff;
  padding:7px 18px;font-size:12px;font-weight:600;letter-spacing:.1px}
.rb-back{font-weight:800;padding:3px 10px;border-radius:7px;background:rgba(255,255,255,.16);white-space:nowrap}
.rb-back:hover{background:rgba(255,255,255,.28)}
.rb-tag{font-weight:900;font-size:10px;letter-spacing:1.4px;padding:3px 8px;border-radius:5px;background:#fff;color:#1F55A8}
.rb-txt{color:#cfe0f7}
@media(max-width:640px){.rb-txt{display:none}}

/* ===== narrow screens =====
   The demo is a desktop tool and the dense tables stay dense — they scroll
   inside their own containers. What must not happen is the whole page
   sliding sideways, which is what the top bar was causing. */
@media(max-width:760px){
  .topbar{height:auto;flex-wrap:wrap;padding:8px 12px;gap:7px;row-gap:4px}
  .brand{margin-right:6px;font-size:15.5px}
  .nav{order:5;width:100%;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a{white-space:nowrap;font-size:13px;padding:6px 10px}
  .topbar .spacer{flex:1 1 auto}
  .rtpick{padding:5px 8px;max-width:170px}
  .rtpick select{max-width:118px;text-overflow:ellipsis}
  .iconbtn{width:30px;height:30px}
  .topbar button.iconbtn{display:none}   /* bell is decorative; keep the storefront link */
  .wrap{padding:12px}
  .sthead .in,.stbar .in{flex-wrap:wrap;gap:10px;padding:12px 14px}
  .stnav{gap:14px;font-size:13px}
  .stwrap{padding:14px}
  .vdpstrip{grid-template-columns:repeat(4,1fr)}
  .specs{grid-template-columns:repeat(2,1fr)}
}

/* ===== console chrome — mirrors src/app/admin/layout.tsx ===== */
.shell{display:flex;min-height:100vh;align-items:flex-start}
.side{width:240px;flex:0 0 240px;align-self:stretch;position:sticky;top:0;height:100vh;
  background:var(--ink);border-right:1px solid #1f2835;display:flex;flex-direction:column;z-index:40}

.side-brand i{position:relative;display:inline-block;width:.363em;height:0;vertical-align:baseline;font-style:normal}
.side-brand i svg{position:absolute;left:0;bottom:-.218em;width:.476em;height:1.089em;fill:#3D8BFF;overflow:visible}
.side-nav{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.slnk{display:block;border-radius:6px;padding:8px 12px;font-size:13.5px;font-weight:500;color:#b2bac8}
.slnk:hover{background:rgba(42,51,66,.6);color:#fff}
.slnk.on{background:#2a3342;color:#fff;font-weight:600}
.side-foot{margin-top:auto;border-top:1px solid #2a3342;padding:14px 12px}
.side-grp{font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:#66748c;padding:6px 8px 4px}
.side-sel{width:100%;background:#18202c;border:1px solid #2a3342;border-radius:6px;color:#b2bac8;
  font-size:12px;padding:6px 8px;font-family:inherit}
.sfoot{display:block;border-radius:6px;padding:6px 8px;font-size:12px;color:#b2bac8}
.sfoot:hover{background:#2a3342;color:#fff}
.side-user{margin-top:12px;border-top:1px solid #2a3342;padding:12px 8px 0}
.side-name{font-size:12px;font-weight:500;color:#fff}
.side-role{font-size:11px;color:#8794a8}
.main{flex:1;min-width:0}

/* ===== page header ===== */
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:4px}
.phead h1{font-size:20px;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
.phead p{font-size:13.5px;color:var(--ink3);margin-top:2px}
.styleSw{display:flex;gap:2px;background:var(--line2);border-radius:9px;padding:3px}
.styleSw a{padding:5px 11px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink3)}
.styleSw a.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(15,22,32,.08)}

/* ===== feed filter chips ===== */
.fchips{display:flex;flex-wrap:wrap;gap:6px}

/* ===== activity log ===== */
.metrics.four{grid-template-columns:repeat(4,1fr)}
.log-list{display:flex;flex-direction:column}
.lrow{display:flex;align-items:flex-start;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line2)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--card2)}
.ltime{width:56px;flex:0 0 56px;text-align:right;font-size:11px;color:var(--ink4);padding-top:2px}
.lkind{width:92px;flex:0 0 92px;display:flex;align-items:baseline;gap:4px;padding-top:2px;
  font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase}
.lkind i{width:12px;text-align:center;font-style:normal}
.g-ink{color:var(--ink3)} .g-amber{color:#b45309} .g-green{color:#047857} .g-blue{color:#1d4ed8}
.g-warn{color:#a16207} .g-aged{color:#b91c1c} .g-hot{color:#c2410c} .g-red{color:#b91c1c}
.g-violet{color:#6d28d9}
.lmain{flex:1;min-width:0}
.ltitle{font-size:13px;font-weight:500;line-height:1.35;color:var(--ink)}
.lcmt{margin-left:6px;font-size:10px;color:var(--ink4)}
.lbody{font-size:11px;line-height:1.35;color:var(--ink3)}
.lstats{margin-top:1px;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:11px;color:var(--ink3)}
.lstats b{font-weight:650;color:var(--ink2)}
.lstats b.up{color:#047857} .lstats b.down{color:#b91c1c}
.lveh{width:176px;flex:0 0 176px;text-align:right;padding-top:2px;font-size:11.5px;font-weight:500;color:var(--ink2)}
.lwho{width:96px;flex:0 0 96px;text-align:right;padding-top:2px;font-size:11px;color:var(--ink4)}
.log-foot{border-top:1px solid var(--line2);background:var(--card2);padding:8px;text-align:center;
  font-size:11px;color:var(--ink3)}

const glyphFor = (v) => GLYPH[v.body] || GLYPH.SUV;

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(v =>
    Math.max(0, Math.min(255, Math.round(amt > 0 ? v + (255 - v) * amt : v * (1 + amt))))
  );
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}
function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (0.299 * ((n >> 16) & 255) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) > 168;
}
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* A paint-swatch tile: the unit's real color, its body glyph, and honest labelling. */
function tileSVG(v, label, idx, total) {
  const uid = 't' + v.id + idx;
  const paint = v.colorHex;
  const light = isLight(paint);
  const a = shade(paint, light ? -0.06 : 0.30);
  const b = shade(paint, light ? -0.34 : -0.30);
  const ink = light ? '#12161c' : '#ffffff';
  const g = glyphFor(v);

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" width="760" height="428" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<defs>

    <stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/>

  <pattern id="hx${uid}" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="0" y2="14" stroke="${ink}" stroke-opacity=".05" stroke-width="7"/>
  </pattern>
  <radialGradient id="vg${uid}" cx=".5" cy=".38" r=".78">
    <stop offset="0" stop-color="#fff" stop-opacity="${light ? .55 : .16}"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="760" height="428" fill="url(#bg${uid})"/>
<rect width="760" height="428" fill="url(#hx${uid})"/>
<rect width="760" height="428" fill="url(#vg${uid})"/>

<g transform="translate(148,150) scale(3.9)" fill="${ink}" opacity=".17">
  <path d="${g.hull}"/>
  ${g.wheels.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${ink}" opacity=".55"/>`).join('')}
</g>

<g fill="${ink}">

const enc = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

const SHOT_LABELS = ['Driver side', 'Front 3/4', 'Rear 3/4', 'Interior', 'Engine bay', 'Wheels', 'Rear seat', 'Cargo'];

/* Real photos live in img/veh/<make-model>/<n>.jpg and are attached to the unit
   as photoFiles by the seed. A unit still in recon shows fewer of them, because
   that is the whole point of the recon state. Anything without photography falls
   back to the generated swatch tile below, so the demo never breaks. */
const PHOTO_DIR = 'img/veh/';

function realShots(v) {
  const files = v.photoFiles || [];
  if (!files.length) return null;
  const cap = v.reconStatus === 'in_recon' ? Math.min(files.length, v.photoCount) : files.length;
  if (cap < 1) return [];
  return files.slice(0, cap).map(([file, label]) => ({ label, src: PHOTO_DIR + file }));
}

function photoSet(v) {
  const real = realShots(v);
  if (real) return real.length ? real : [{ label: 'No photos yet', src: enc(tileSVG(v, 'Awaiting photos', 0, 1)) }];

  const n = Math.max(1, Math.min(8, Math.round(v.photoCount / 4)));
  const shots = [];
  for (let i = 0; i < n; i++) {
    shots.push({ label: SHOT_LABELS[i % SHOT_LABELS.length], src: enc(tileSVG(v, SHOT_LABELS[i % SHOT_LABELS.length], i, n + 1)) });
  }
  shots.push({ label: 'Odometer', src: enc(odoSVG(v)) });
  return shots;
}

function heroPhoto(v) {
  const real = realShots(v);
  if (real && real.length) return real[0].src;
  if (real) return enc(tileSVG(v, 'Awaiting photos', 0, 1));
  return enc(tileSVG(v, 'Driver side', 0, Math.max(2, Math.round(v.photoCount / 4) + 1)));
}

    stats: [

      { k: 'Sold price', v: '$' + s.price.toLocaleString() },

    id: 'e_tim', hours: 5, kind: 'team', actor: 'u_ray', icon: '👋',
    title: 'Meet Tim Boyd — starting Monday at Orchards',
    text: 'Tim comes over from a franchise store with ten years in. Knows trucks cold and has done his own desking. He is on the Orchards side but will float. Say hi when you see him.',
    person: 'u_tim',
    comments: [{ who: 'u_mike', text: 'Welcome aboard Tim.' }],

    comments: [],

        { k: 'Photos', v: v.photoCount },
        { k: 'Priced at', v: '$' + v.price.toLocaleString() },

      comments: i === 0 ? [{ who: 'u_mike', text: 'Already have someone coming to look at this Saturday.' }] : [],
      react: { thumb: 3, fire: i === 0 ? 2 : 0 },
    });
    else push({
      id: 'e_acq' + v.id, hours: 9 + i * 6, kind: 'acquired', actor: 'system', icon: '🚚',
      title: `${v.year} ${v.make} ${v.model} ${v.trim} landed on the lot`,

        { k: 'Total cost', v: '$' + v.totalCost.toLocaleString() },

        { k: 'Dark for', v: bad[1].pushedAt },
      ],
      comments: [],
      fix: true,
    });
  }

  return ev.sort((a, b) => a.hours - b.hours);
}

/* ============================ Vehicle profile ============================ */
function wall(v) {
  const d = v.daysInStock;
  const ev = [];
  const at = (daysAgo) => daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : `${daysAgo} days ago`;
  ev.push({ d, ic: '🚚', h: `Acquired — ${v.source}`, t: `Stock #${v.stock} created. ACV ${money(v.cost)}, pack ${money(v.pack)}.` });
  ev.push({ d: d - 1, ic: '🔧', h: 'Into the recon bay', t: v.reconNote });
  if (v.reconStatus === 'complete') {
    ev.push({ d: d - v.reconDays, ic: '✅', h: `Recon closed — ${v.reconDays} days`, t: `${money(v.reconCost)} in recon. ${v.reconDays <= 7 ? 'Inside the 5–7 day target.' : 'Over the 5–7 day target.'}` });
    ev.push({ d: d - v.reconDays, ic: '📸', h: `${v.photoCount} photos uploaded`, t: 'Rob Chen shot the unit on the back row.' });
    ev.push({ d: d - v.reconDays, ic: '🟢', h: 'Front-line ready', t: `Went live on ${CHANNELS.length} channels at ${money(v.price)}.` });
  } else {
    ev.push({ d: 0, ic: '⏳', h: `Still in recon — day ${v.reconDays}`, t: 'Held out of syndication until photos are up.' });
  }
  if (d > 30) ev.push({ d: d - 30, ic: '⚠︎', h: 'Added to the at-risk list', t: 'Crossed 30 days. Flagged for a decision on the next lot walk.' });
  if (d > 45) ev.push({ d: d - 45, ic: '💲', h: 'Price cut $500', t: `${money(v.price + 500)} → ${money(v.price)} at 45 days with no deal.` });
  if (d > 61) ev.push({ d: d - 61, ic: '🕒', h: 'Became an aged unit', t: 'Past 60 days on the ground and still eating floorplan.' });
  if (v.isWater) ev.push({ d: 3, ic: '🌊', h: 'Flagged as a water unit', t: `Total cost ${money(v.totalCost)} is above market of ${money(v.market)}.` });
  if (v.frontLineReady) ev.push({ d: 0, ic: '📈', h: `${v.vdpViews7} VDP views in the last 7 days`, t: `${leads7(v)} lead${leads7(v) === 1 ? '' : 's'} this week · ${v.vdpViewsTotal} views and ${v.leads} leads lifetime.` });

  return ev.sort((a, b) => b.d - a.d).map(e =>
    `<div class="wev"><div class="wdot">${e.ic}</div>
      <div class="grow"><div class="h">${esc(e.h)}</div>
      <div class="sm muted">${esc(e.t)}</div>
      <div class="t" style="margin-top:2px">${at(Math.max(0, e.d))}</div></div></div>`).join('');
}

/* ============================ Syndication ============================ */
function logLine(cls, text) { state.log.push({ cls, text }); if (state.log.length > 60) state.log.shift(); }

function pushPrice(v, newPrice) {
  if (state.ui.busy) return;
  state.ui.busy = true;
  const old = v.price;
  v.price = newPrice;
  logLine('br', `▸ price change  STK ${v.stock}  ${money(old)} → ${money(newPrice)}`);
  logLine('dim', `  one record changed. fanning out to ${CHANNELS.length} channels…`);

  CHANNELS.forEach(c => {
    const l = v.listings[c.id];
    if (l.status === 'off') { logLine('dim', `  ${c.short.padEnd(12)} skipped — unit is not syndicated`); return; }
    l.status = 'queued';
    const delay = c.demoMs[0] + Math.random() * (c.demoMs[1] - c.demoMs[0]);
    setTimeout(() => { l.status = 'syncing'; logLine('dim', `  ${c.short.padEnd(12)} pushing…`); render(); }, delay * 0.45);
    setTimeout(() => {
      if (l.error && c.id === 'meta') {
        l.status = 'error';
        logLine('er', `  ${c.short.padEnd(12)} REJECTED — ${l.error}`);
      } else {
        l.status = 'live'; l.price = newPrice; l.pushedAt = 'just now'; l.error = null;
        logLine('ok', `  ${c.short.padEnd(12)} live at ${money(newPrice)}  (real-world: ${c.realNote})`);
      }
      render();
    }, delay);
  });
  setTimeout(() => {
    state.ui.busy = false;
    logLine('dim', `  done. you changed the price once.`);
    render();
  }, 3100);
  render();
}

function sparkline(vals, w = 560, h = 78, color = 'var(--brand)') {
  const max = Math.max(...vals), min = Math.min(...vals) * 0.9;
  const pt = (v, i) => [i * (w / (vals.length - 1)), h - ((v - min) / (max - min)) * (h - 8) - 4];
  const line = vals.map((v, i) => pt(v, i).join(',')).join(' L');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="sp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="M${line} L${w},${h} L0,${h} Z" fill="url(#sp)"/>
    <path d="M${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>
    ${vals.map((v, i) => { const [x, y] = pt(v, i); return `<circle cx="${x}" cy="${y}" r="2.5" fill="${color}"/>`; }).join('')}
  </svg>`;
}

            <span class="muted tiny">${state.vehicles.filter(v => v.make === mk && v.frontLineReady).length}</span></label>`).join('')}</div>
        <button class="btn ghost sm" style="width:100%;justify-content:center;margin-top:12px" data-act="st-clear">Clear filters</button>
      </div>
    </aside>

    <div>
      <div class="row" style="margin-bottom:14px">
        <div class="grow"><div style="font-size:24px;font-weight:850;letter-spacing:-.7px">${inv.length} vehicles available</div>
          <div class="sm muted">Both Vancouver locations shown together — ask us to bring any unit to whichever lot is closer.</div></div>
        <select class="sel"><option>Newest arrivals</option><option>Price: low to high</option><option>Lowest miles</option></select>
      </div>
      <div class="cards">
        ${inv.map(v => `<div class="vcard rel" data-act="stveh" data-id="${v.id}">
          <img src="${v.hero}" alt="">
          ${v.daysInStock <= 7 ? '<span class="badge" style="top:auto;bottom:10px;background:rgba(21,163,74,.94)">Just arrived</span>'
            : isAged(v) ? '<span class="badge" style="top:auto;bottom:10px;background:rgba(207,43,38,.94)">Price reduced</span>' : ''}
          <div class="b">
            <div class="ttl">${esc(vfull(v))}</div>
            <div class="sub">${v.mileage.toLocaleString()} mi · ${esc(v.drivetrain)} · ${esc(v.exteriorColor)}</div>
            <div class="pr">${money(v.price)}</div>
            <div class="row tiny muted" style="margin-top:7px;justify-content:space-between">
              <span>${esc(v.carfax)}</span><span>${esc(rooftopName(v.rooftop))}</span></div>
          </div></div>`).join('')}
      </div>
      ${inv.length === 0 ? '<div class="card pad muted" style="text-align:center">Nothing matches those filters right now.</div>' : ''}
    </div>
  </div></div></div>`;
}

function viewVDP(id) {
  const v = byId(id); if (!v) return viewStore();
  const shot = Math.min(state.ui.stShot, v.photos.length - 1);
  const R = 0.079 / 12;
  const pay = Math.round(((v.price * 0.9) * R) / (1 - Math.pow(1 + R, -72)));
  const similar = state.vehicles.filter(x => x.id !== v.id && x.frontLineReady && x.body === v.body).slice(0, 3);

  return `<div class="store">${storeHeader()}<div class="stwrap">
    <div class="sm muted" style="margin-bottom:12px"><a href="#/store">Inventory</a> › ${esc(v.body)} › ${esc(vname(v))}</div>
    <div class="vdp">
      <div>
        <div class="vdpgal">
          <img class="main" src="${v.photos[shot].src}" alt="">
          <div class="vdpstrip">${v.photos.map((p, i) =>
            `<img src="${p.src}" class="${i === shot ? 'on' : ''}" data-act="stshot" data-i="${i}">`).join('')}</div>
        </div>

        <h1 style="font-size:29px;font-weight:850;letter-spacing:-1px;margin:22px 0 4px">${esc(vfull(v))}</h1>
        <div class="muted" style="margin-bottom:18px">${v.mileage.toLocaleString()} miles · ${esc(v.drivetrain)} · ${esc(v.engine)}
          · Stock #${v.stock} · <span class="mono tiny">VIN ${v.vin}</span></div>

        <div class="specs">
          ${[['Mileage', v.mileage.toLocaleString() + ' mi'], ['Drivetrain', v.drivetrain], ['Transmission', v.transmission],
             ['Engine', v.engine], ['Exterior', v.exteriorColor], ['Interior', v.interiorColor],
             ['Body', v.body], ['History', v.carfax], ['Title', v.titleStatus]]
            .map(([k, val]) => `<div><div class="k">${k}</div><div class="v">${esc(val)}</div></div>`).join('')}
        </div>

        <h3 style="margin:26px 0 10px;font-size:17px;font-weight:800">What's on it</h3>
        <div class="feats">${v.features.map(x => `<span class="feat">${esc(x)}</span>`).join('')}</div>

        <h3 style="margin:26px 0 10px;font-size:17px;font-weight:800">From the lot</h3>
        <p class="muted" style="max-width:64ch;line-height:1.65">Local ${v.year} ${v.model} ${v.trim} in ${esc(v.exteriorColor)}
          over ${esc(v.interiorColor)}. ${esc(v.carfax)} history and ${v.titleStatus.toLowerCase()} title. Just came through our
          shop — ${esc(v.reconNote.toLowerCase())}. ${esc(v.drivetrain)} and ready to go. Sitting at our
          ${esc(rooftopName(v.rooftop))} lot; happy to move it to the other store if that is closer to you.</p>

        <h3 style="margin:30px 0 12px;font-size:17px;font-weight:800">Similar ${esc(v.body.toLowerCase())}s on the lot</h3>
        <div class="cards">${similar.map(s => `<div class="vcard" data-act="stveh" data-id="${s.id}">
          <img src="${s.hero}"><div class="b"><div class="ttl">${esc(vname(s))}</div>
          <div class="sub">${s.mileage.toLocaleString()} mi</div><div class="pr">${money(s.price)}</div></div></div>`).join('')}</div>
      </div>

      <div class="sticky" style="top:16px">
        <div class="pbox">
          <div class="top">
            <div class="tiny muted" style="font-weight:800;letter-spacing:1px;text-transform:uppercase">Our price</div>
            <div class="price">${money(v.price)}</div>
            <div class="pay">Est. <b>${money(pay)}/mo</b> · 72 mo · 10% down · 7.9% APR</div>
            <div class="tiny muted" style="margin-top:6px">Estimate only, on approved credit.</div>
          </div>
          <div style="padding:14px 16px;display:flex;flex-direction:column;gap:9px">
            <button class="btn" style="justify-content:center">Check availability</button>
            <button class="btn ghost" style="justify-content:center">Get my trade value</button>
            <button class="btn ghost" style="justify-content:center">Apply for financing</button>
          </div>
          <div style="border-top:1px solid var(--line2);padding:14px 16px">
            <div class="row" style="gap:10px"><div class="av" style="background:#39434f">CM</div>
              <div><div style="font-weight:800">${esc(SEED.virtualRooftop.name)}</div>
                <div class="tiny muted">${esc((SEED.rooftops.find(r => r.id === v.rooftop) || {}).address)}<br>Vancouver, WA</div></div></div>
            <div style="margin-top:12px;font-size:17px;font-weight:800">${esc((SEED.rooftops.find(r => r.id === v.rooftop) || {}).phone)}</div>
          </div>
          <div style="border-top:1px solid var(--line2);padding:12px 16px" class="tiny muted">
            ${v.daysInStock <= 7 ? '🟢 Just arrived — ' : ''}${v.daysInStock} days on our lot · ${v.vdpViewsTotal} people have viewed this vehicle
          </div>
        </div>
      </div>
    </div>
  </div></div>`;
}

/* ============================ router ============================ */
const RIBBON = `<div class="ribbon">
  <a href="../index.html" class="rb-back">&#9664; rooftopauto.com</a>
  <span class="rb-tag">LIVE DEMO</span>
  <span class="rb-txt">Cascade Motors is a fictional two-rooftop lot in Vancouver, WA. Every number on these screens is sample data. The vehicle photographs are real and freely licensed &mdash; <a href="credits.html" class="rb-link">credits</a>.</span>
</div>`;

function render() {
  const r = state.route;
  let html;
  // The storefront is the dealer's public site and gets none of the console
  // chrome; everything else lives inside the sidebar shell the app uses.
  if (r.startsWith('#/store/v/')) {
    document.body.innerHTML = RIBBON + viewVDP(r.split('/')[3]);
    return;
  }
  if (r.startsWith('#/store')) {
    document.body.innerHTML = RIBBON + viewStore();
    return;
  }

  if (r.startsWith('#/vehicle/')) html = viewVehicle(r.split('/')[2]);
  else if (r.startsWith('#/inventory')) html = viewInventory();
  else if (r.startsWith('#/syndication')) html = viewSyndication();
  else if (r.startsWith('#/reporting')) html = viewReporting();
  else if (r.startsWith('#/log')) html = viewActivityLog();
  else if (r.startsWith('#/dashboard')) html = viewStub('Dashboard');
  else if (r.startsWith('#/ad-desk')) html = viewStub('Ad Desk');
  else if (r.startsWith('#/website')) html = viewStub('Website');
  else if (r.startsWith('#/lots')) html = viewStub('Lots');
  else html = viewLotWalk();

  document.body.innerHTML =
    RIBBON + `<div class="shell">${sidebar()}<div class="main">${html}</div></div>`;
  const lg = $('.log'); if (lg) lg.scrollTop = lg.scrollHeight;
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const a = t.dataset.act;
  if (a === 'react') {
    const id = t.dataset.ev, k = t.dataset.kind;
    state.reactions[id] = state.reactions[id] || {};
    state.reactions[id][k] = !state.reactions[id][k];
    render(); e.preventDefault();
  } else if (a === 'veh' || a === 'stveh') {
    location.hash = (a === 'veh' ? '#/vehicle/' : '#/store/v/') + t.dataset.id;
    state.ui.tab = 'wall'; state.ui.shot = 0; state.ui.stShot = 0;
  } else if (a === 'tab') { state.ui.tab = t.dataset.t; render(); }
  else if (a === 'shot') { state.ui.shot = +t.dataset.i; render(); }
  else if (a === 'stshot') { state.ui.stShot = +t.dataset.i; render(); }
  else if (a === 'rooftop-set') { state.rooftop = t.dataset.id; render(); e.preventDefault(); }
  else if (a === 'goto-syn') { location.hash = '#/syndication'; }
  else if (a === 'goto-syn-veh') { state.ui.synVeh = t.dataset.id; location.hash = '#/syndication'; }
  else if (a === 'push') {
    const v = state.ui.synVeh ? byId(state.ui.synVeh) : scoped().find(x => x.frontLineReady);
    const raw = ($('[data-act="syn-price"]') || {}).value;
    const np = parseInt(String(raw).replace(/[^0-9]/g, ''), 10);
    if (v && np > 0) pushPrice(v, np);
  }
  else if (a === 'st-clear') { state.ui.stFilters = { makes: [], body: [], q: '', maxPrice: 60000, maxMiles: 200000 }; render(); }
});

document.addEventListener('change', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'rooftop') { state.rooftop = t.value; render(); }
  else if (a === 'syn-veh') { state.ui.synVeh = t.value; render(); }
  else if (a === 'st-make' || a === 'st-body') {
    const key = a === 'st-make' ? 'makes' : 'body';
    const arr = state.ui.stFilters[key];
    const i = arr.indexOf(t.value);
    i > -1 ? arr.splice(i, 1) : arr.push(t.value);
    render();
  }
});

document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act;
  if (a === 'st-price') { state.ui.stFilters.maxPrice = +t.value; const s = t.value; render();
    const el = $('[data-act="st-price"]'); if (el) el.value = s; }
  else if (a === 'st-miles') { state.ui.stFilters.maxMiles = +t.value; render(); }
});

document.addEventListener('keydown', (e) => {
  const t = e.target.closest('[data-act]');
  if (!t || e.key !== 'Enter') return;
  if (t.dataset.act === 'comment' && t.value.trim()) {
    const id = t.dataset.ev;
    (state.extraComments[id] = state.extraComments[id] || []).push({ who: state.me, text: t.value.trim() });
    render();
  } else if (t.dataset.act === 'st-q') { state.ui.stFilters.q = t.value; render(); }
});

let _q;
document.addEventListener('input', (e) => {
  const t = e.target.closest('[data-act="st-q"]'); if (!t) return;
  clearTimeout(_q); const val = t.value;
  _q = setTimeout(() => { state.ui.stFilters.q = val; render();
    const el = $('[data-act="st-q"]'); if (el) { el.focus(); el.value = val; } }, 260);
});

window.addEventListener('hashchange', () => { state.route = location.hash || '#/lotwalk'; window.scrollTo(0, 0); render(); });
state.route = location.hash || '#/lotwalk';
render();

/* ============================ Activity log ============================
   One event stream, two presentations — `claude/log-vs-social.md`. Same rows
   the feed draws as cards: no avatars, no reactions, no composer, no faces.
   The stats stay, and do more work here than they do on a card: strip the
   chrome off a line with no figure on it and you are left with one line of
   nothing.
====================================================================== */
const LOG_GLYPH = {
  acquired: ['+', 'g-ink', 'Acquired'],
  recon_in: ['→', 'g-amber', 'Into recon'],
  recon_out: ['✓', 'g-green', 'Recon closed'],
  photos: ['▣', 'g-ink', 'Photos'],
  front_line: ['●', 'g-green', 'Front line'],
  price_change: ['$', 'g-blue', 'Price'],
  at_risk: ['!', 'g-warn', 'At risk'],
  aged: ['!!', 'g-aged', 'Aged'],
  water: ['~', 'g-hot', 'Water'],
  vdp_milestone: ['↑', 'g-blue', 'Traffic'],
  sync_error: ['×', 'g-red', 'Channel'],
  sold: ['★', 'g-green', 'Sold'],
  bell: ['★', 'g-amber', 'Bell'],
  team: ['·', 'g-violet', 'Team'],
  note: ['·', 'g-ink', 'Note'],
  domain: ['@', 'g-blue', 'Website'],
};

function logStamp(hoursAgo) {
  const d = new Date(Date.now() - hoursAgo * 3600e3);
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return hoursAgo < 24
    ? time
    : `${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} ${time}`;
}

function logRow(e) {
  const g = LOG_GLYPH[e.kind] || LOG_GLYPH.note;
  const p = e.actor === 'system' ? null : person(e.actor);
  const cmts = (e.comments || []).length + (state.extraComments[e.id] || []).length;
  const v = e.vehicle || (e.units && e.units[0]);
  return `<div class="lrow">
    <span class="ltime num">${logStamp(e.hours)}</span>
    <span class="lkind ${g[1]}"><i>${g[0]}</i>${g[2]}</span>
    <div class="lmain">
      <div class="ltitle">${esc(e.title)}${cmts ? `<span class="lcmt">\u{1F4AC}${cmts}</span>` : ''}</div>
      ${e.text ? `<div class="lbody trunc">${esc(e.text)}</div>` : ''}
      ${e.stats ? `<div class="lstats">${e.stats.map(s =>
        `<span>${esc(s.k)} <b class="num ${s.good ? 'up' : s.bad ? 'down' : ''}">${s.v}</b></span>`).join('')}</div>` : ''}
    </div>
    <div class="lveh">${v ? `<a href="#/vehicle/${v.id}">
        <div class="trunc">${esc(vname(v))}</div>
        <div class="tiny muted num trunc">STK ${v.stock} · ${money(v.price)}</div></a>` : ''}</div>
    <span class="lwho trunc">${p ? esc(p.name) : 'System'}</span>
  </div>`;
}

function viewActivityLog() {
  const rows = buildFeed();
  return `<div class="wrap"><div class="cols one">
    <div class="stack">
      ${pageHead('Activity', lotLine(), 'log')}
      ${metricStripLog()}
      ${filterChips()}
      <div class="card">
        <div class="log-list">${rows.map(logRow).join('')}</div>
        <div class="log-foot">Last ${rows.length} entries. Same record as Lot Walk &mdash; only the layout differs.</div>
      </div>
    </div>
  </div></div>`;
}

/** The log keeps the four money figures. The scoreboard is a Lot Walk thing. */
function metricStripLog() {
  const m = metrics();
  const tile = (k, v) => `<div class="metric"><div class="k">${k}</div><div class="v num">${v}</div></div>`;
  return `<div class="metrics four">
    ${tile('Sold today', SALES.filter(s => s.when === 0).length)}
    ${tile('Sold 30d', m.sales30)}
    ${tile('Front gross 30d', money(m.grossMTD))}
    ${tile('Money on the ground', money(m.invValue))}
  </div>`;
}

</script>
