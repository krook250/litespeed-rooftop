<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — Rooftop Auto</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0e141d; color: #b2bac8; padding: 2rem;
    font: 400 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card { max-width: 22rem; text-align: center; }
  svg { display: block; margin: 0 auto 1.25rem; }
  h1 { margin: 0 0 .5rem; font-size: 17px; font-weight: 600; color: #fff; }
  p { margin: 0 0 1.5rem; }
  button {
    font: inherit; font-weight: 500; color: #0e141d; background: #3D8BFF;
    border: 0; border-radius: 8px; padding: .6rem 1.1rem; cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <svg width="64" height="40" viewBox="0 0 1024 640" aria-hidden="true">
      <path d="M170 620 L512 372 L854 620" fill="none" stroke="#3D8BFF"
            stroke-width="104" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>No connection</h1>
    <p>Rooftop needs a signal to show the lot. Nothing you typed was lost&nbsp;— it just hasn't been sent yet.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
